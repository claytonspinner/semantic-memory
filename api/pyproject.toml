[project]
name = "semantic-memory-api"
version = "0.1.0"
description = "Minimal semantic memory layer with FastAPI + MCP + pgvector"
requires-python = ">=3.12"

dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "mcp>=1.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"